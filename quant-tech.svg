<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">Quantitative finance visualization</title>
<desc id="d">Abstract premium visualization of portfolio construction, risk curves and market structure.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#081823"/><stop offset="100%" stop-color="#102a36"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6fe5d9"/><stop offset="100%" stop-color="#4f9edd"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d9b36d"/><stop offset="100%" stop-color="#f2d79b"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<g opacity="0.15" stroke="#87c6c0" stroke-width="1">
  <path d="M0 620H1200M0 500H1200M0 380H1200M0 260H1200M0 140H1200"/>
  <path d="M120 0V760M260 0V760M400 0V760M540 0V760M680 0V760M820 0V760M960 0V760M1100 0V760"/>
</g>
<g opacity="0.18"><circle cx="930" cy="180" r="170" fill="#1b4b5c"/><circle cx="1020" cy="540" r="210" fill="#12303d"/></g>
<g filter="url(#glow)">
  <path d="M70 590 C 180 550, 245 545, 340 500 S 510 420, 615 392 S 770 315, 860 260 S 1030 195, 1135 126" fill="none" stroke="url(#teal)" stroke-width="7" stroke-linecap="round"/>
  <path d="M70 620 C 180 602, 280 565, 390 575 S 540 547, 650 500 S 810 446, 905 454 S 1040 430, 1135 392" fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" opacity="0.95"/>
</g>
<g opacity="0.8" fill="#dce8e6" font-family="Arial, sans-serif">
  <text x="80" y="90" font-size="20" letter-spacing="5">QUANTITATIVE FINANCE</text>
  <text x="81" y="120" font-size="12" letter-spacing="6" opacity="0.75">RISK • PORTFOLIO • HEDGING • OPTIMIZATION</text>
  <text x="930" y="110" font-size="12" letter-spacing="4" opacity="0.65">SYSTEMIC VIEW</text>
</g>
<g>
  <rect x="78" y="150" rx="18" ry="18" width="336" height="174" fill="#102c38" stroke="#234754"/>
  <text x="108" y="195" fill="#f1f5f3" font-size="18" font-family="Arial, sans-serif">Allocation engine</text>
  <text x="108" y="236" fill="#9fc2bf" font-size="13" font-family="Arial, sans-serif">μ   expected return</text>
  <text x="108" y="262" fill="#9fc2bf" font-size="13" font-family="Arial, sans-serif">Σ   covariance structure</text>
  <text x="108" y="288" fill="#9fc2bf" font-size="13" font-family="Arial, sans-serif">w*  robust optimal weights</text>
  <text x="108" y="310" fill="#d9b36d" font-size="26" font-family="Georgia, serif">argmin  wᵀΣw  -  λ μᵀw</text>
</g>
<g>
  <rect x="715" y="448" rx="18" ry="18" width="404" height="190" fill="#0d2230" stroke="#244552"/>
  <g transform="translate(760 495)">
    <rect x="0" y="65" width="40" height="68" fill="#2e7080"/>
    <rect x="57" y="42" width="40" height="91" fill="#4aa5b7"/>
    <rect x="114" y="22" width="40" height="111" fill="#78ddd1"/>
    <rect x="171" y="50" width="40" height="83" fill="#d9b36d"/>
    <rect x="228" y="31" width="40" height="102" fill="#ecd49a"/>
    <rect x="285" y="11" width="40" height="122" fill="#ffffff" opacity="0.9"/>
  </g>
  <text x="760" y="470" fill="#edf3f2" font-size="18" font-family="Arial, sans-serif">Strategy analytics</text>
  <text x="760" y="617" fill="#97b5b8" font-size="13" font-family="Arial, sans-serif">drawdown • turnover • variance reduction • support stability</text>
</g>
</svg>